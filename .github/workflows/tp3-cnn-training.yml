name: TP3 - CNN Training & Style Transfer

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/cnn_classification.py'
      - 'src/style_transfer.py'
      - 'requirements.txt'
      - '.github/workflows/tp3-cnn-training.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      exercise:
        description: 'Which exercise to run'
        required: false
        type: choice
        options:
          - all
          - exercise1
          - exercise2
          - exercise4
        default: 'all'
      style_transfer_enabled:
        description: 'Enable style transfer (Exercise 4)'
        type: boolean
        default: false

env:
  MODEL_NAME: cifar10-cnn-classifier
  PYTHON_VERSION: "3.10"

jobs:
  exercise1-basic-cnn:
    name: Exercise 1 - Basic CNN
    runs-on: ubuntu-latest
    if: github.event.inputs.exercise == 'exercise1' || github.event.inputs.exercise == 'all' || github.event.inputs.exercise == ''
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> .env
        echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> .env
        echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> .env
        echo "MODEL_NAME=${{ env.MODEL_NAME }}" >> .env
        echo "MLFLOW_S3_ENDPOINT_URL=${{ secrets.MLFLOW_S3_ENDPOINT_URL }}" >> .env
        echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
        echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
    
    - name: Run Exercise 1 - Basic CNN
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        MLFLOW_S3_IGNORE_TLS: true
        AWS_S3_ADDRESSING_STYLE: path
        MODEL_NAME: ${{ env.MODEL_NAME }}
      run: |
        python -c "from src.cnn_classification import exercise_1_basic_cnn; exercise_1_basic_cnn()" | tee exercise1_output.txt
    
    - name: Upload Exercise 1 Logs
      uses: actions/upload-artifact@v4
      with:
        name: exercise1-logs
        path: exercise1_output.txt

  exercise2-resnet:
    name: Exercise 2 - ResNet CNN
    runs-on: ubuntu-latest
    if: github.event.inputs.exercise == 'exercise2' || github.event.inputs.exercise == 'all' || github.event.inputs.exercise == ''
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> .env
        echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> .env
        echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> .env
        echo "MODEL_NAME=${{ env.MODEL_NAME }}" >> .env
        echo "MLFLOW_S3_ENDPOINT_URL=${{ secrets.MLFLOW_S3_ENDPOINT_URL }}" >> .env
        echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
        echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
    
    - name: Run Exercise 2 - ResNet
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        MLFLOW_S3_IGNORE_TLS: true
        AWS_S3_ADDRESSING_STYLE: path
        MODEL_NAME: ${{ env.MODEL_NAME }}
      run: |
        python -c "from src.cnn_classification import exercise_2_resnet; exercise_2_resnet()" | tee exercise2_output.txt
    
    - name: Upload Exercise 2 Logs
      uses: actions/upload-artifact@v4
      with:
        name: exercise2-logs
        path: exercise2_output.txt

  promote-best-model:
    name: Auto-Promote Best CNN Model
    needs: [exercise1-basic-cnn, exercise2-resnet]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install MLflow
      run: |
        pip install mlflow python-dotenv boto3
    
    - name: Create .env file
      run: |
        echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> .env
        echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> .env
        echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> .env
        echo "MODEL_NAME=${{ env.MODEL_NAME }}" >> .env
        echo "MIN_ACCURACY=${{ secrets.MIN_ACCURACY || '0.70' }}" >> .env
        echo "MIN_F1_SCORE=${{ secrets.MIN_F1_SCORE || '0.68' }}" >> .env
    
    - name: Find and Promote Best Model
      run: |
        python -c "
        import mlflow
        from mlflow.tracking import MlflowClient
        from config.mlflow_config import MLflowConfig
        
        MLflowConfig.setup_mlflow()
        client = MlflowClient()
        
        # Chercher les runs récents dans les expériences TP3
        experiments = ['TP3-Exercise1-BasicCNN', 'TP3-Exercise2-ResNet']
        best_run = None
        best_accuracy = 0
        
        for exp_name in experiments:
            try:
                exp = client.get_experiment_by_name(exp_name)
                if exp:
                    runs = client.search_runs(exp.experiment_id, order_by=['metrics.test_accuracy DESC'], max_results=1)
                    if runs and runs[0].data.metrics.get('test_accuracy', 0) > best_accuracy:
                        best_accuracy = runs[0].data.metrics['test_accuracy']
                        best_run = runs[0]
            except:
                pass
        
        if best_run and best_accuracy >= float('${{ secrets.MIN_ACCURACY }}' or 0.70):
            print(f'Best model found: {best_run.info.run_id} with accuracy {best_accuracy:.4f}')
            # Promouvoir le modèle via auto_promote.py
            import subprocess
            subprocess.run(['python', '-m', 'src.auto_promote', best_run.info.run_id])
        else:
            print('No model meets promotion criteria')
        "

  summary:
    name: Generate Training Summary
    runs-on: ubuntu-latest
    needs: [exercise1-basic-cnn, exercise2-resnet]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: logs/
    
    - name: Generate Summary
      run: |
        echo "# TP3 CNN Training Summary" > summary.md
        echo "" >> summary.md
        echo "## Workflow Run: ${{ github.run_number }}" >> summary.md
        echo "**Date**: $(date)" >> summary.md
        echo "**Commit**: ${{ github.sha }}" >> summary.md
        echo "" >> summary.md
        
        echo "## Results" >> summary.md
        echo "" >> summary.md
        
        if [ -f "logs/exercise1-logs/exercise1_output.txt" ]; then
          echo "### Exercise 1: Basic CNN (CIFAR-10)" >> summary.md
          echo '```' >> summary.md
          tail -30 logs/exercise1-logs/exercise1_output.txt >> summary.md
          echo '```' >> summary.md
          echo "" >> summary.md
        fi
        
        if [ -f "logs/exercise2-logs/exercise2_output.txt" ]; then
          echo "### Exercise 2: ResNet CNN (CIFAR-10)" >> summary.md
          echo '```' >> summary.md
          tail -30 logs/exercise2-logs/exercise2_output.txt >> summary.md
          echo '```' >> summary.md
          echo "" >> summary.md
        fi
        
        echo "## MLflow Tracking" >> summary.md
        echo "View detailed results at: ${{ secrets.MLFLOW_TRACKING_URI }}" >> summary.md
        echo "" >> summary.md
        echo "### Experiments Created:" >> summary.md
        echo "- TP3-Exercise1-BasicCNN" >> summary.md
        echo "- TP3-Exercise2-ResNet" >> summary.md
        
        cat summary.md
    
    - name: Upload Summary Report
      uses: actions/upload-artifact@v4
      with:
        name: tp3-summary-report
        path: summary.md
    
    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });